<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Taxi SaaS</title>
    <link rel="manifest" href="/public/manifest.json">
<meta name="theme-color" content="#8A2BE2">
</head>
<body class="bg-black text-white font-sans">
    <div class="max-w-md mx-auto min-h-screen p-6 flex flex-col justify-between">
        
        <header class="flex justify-between items-center">
            <span class="text-gray-400">←</span>
            <h1 id="nombre-comercial" class="font-bold uppercase tracking-widest text-sm">Cargando...</h1>
            <span class="text-xs">👑</span>
        </header>

        <div class="h-64 bg-zinc-900 rounded-3xl my-6 flex items-center justify-center border border-zinc-800">
            <p class="text-zinc-500 italic">Cargando Mapa de Google...</p>
        </div>

        <div class="space-y-4">
            <input type="text" placeholder="¿A dónde vas?" class="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl outline-none focus:border-purple-500 transition-all">
            
            <button id="btn-reservar" class="w-full py-4 rounded-2xl font-bold shadow-xl transition-transform active:scale-95">
                RESERVAR AHORA
            </button>
        </div>

    </div>
</body>
</html>
