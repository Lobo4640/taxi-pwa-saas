<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiveMad – Taxi PWA SaaS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --blue: #00B5FF;
            --dark: #112F5C;
            --bg-app: #ffffff;
            --input-bg: #e5e7eb;
        }

        body { 
            background: #001a3d; 
            font-family: "Montserrat", sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            height: 100vh; 
        }

        .mobile-container {
            width: 100%; 
            max-width: 414px; 
            background: var(--bg-app); 
            position: relative;
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* --- PANTALLA LOGIN --- */
        #auth-screen {
            position: absolute; 
            inset: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            padding: 40px; 
            background: #001a3d; 
            color: white; 
            z-index: 1000; 
            text-align: center;
        }

        .input-auth {
            width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); 
            color: white; outline: none; font-size: 16px;
        }

        /* --- APP PRINCIPAL --- */
        #main-app { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            background: white;
        }

        .user-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #ddd; }
        .logo-txt { font-weight: 800; font-size: 22px; color: var(--dark); }
        .logo-txt span { color: var(--blue); }

        .form-content { padding: 0 20px; }
        .input-group { position: relative; margin-bottom: 10px; }
        .input-group input {
            width: 100%; padding: 15px 50px 15px 18px; border-radius: 10px;
            background: var(--input-bg); border: none; font-size: 15px; font-weight: 500; color: #444;
        }
        .input-group i { 
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%); 
            color: var(--blue); font-size: 18px; cursor: pointer; 
        }

        #map { width: 100%; flex-grow: 1; background: #f0f0f0; margin-top: 10px; }

        .btn-main {
            background: linear-gradient(90deg, #38bdf8 0%, #4f46e5 100%);
            color: white; padding: 18px; border-radius: 12px; width: 90%;
            margin: 15px auto; font-weight: 700; text-align: center; cursor: pointer; border: none;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
        }
        .btn-main:active { transform: scale(0.98); opacity: 0.9; }
        .btn-main:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        /* Bottom Nav */
        .bottom-nav {
            height: 75px; background: white; display: flex; 
            justify-content: space-around; align-items: center; border-top: 1px solid #eee;
        }
        .nav-item { text-align: center; color: #999; cursor: pointer; font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--dark); }
        .nav-item i { display: block; font-size: 22px; margin-bottom: 4px; }

        #view-profile { display: none; padding: 40px 25px; text-align: center; flex-grow: 1; }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <div id="auth-screen">
        <div style="font-size: 35px; font-weight: 800; margin-bottom: 40px;">Live<span style="color:var(--blue)">Mad</span></div>
        <p class="mb-6 opacity-70">Acceso Premium SaaS</p>
        <input type="text" id="user-login" placeholder="Usuario (admin)" class="input-auth">
        <input type="password" id="pass-login" placeholder="Contraseña (1234)" class="input-auth">
        <button onclick="intentarAcceso()" class="btn-main" style="width: 100%; margin-top: 20px;">INICIAR SESIÓN</button>
    </div>

    <div id="main-app">
        
        <div id="view-home" style="display: flex; flex-direction: column; height: calc(100% - 75px);">
            <header class="user-header">
                <div class="user-info">
                    <img id="img-mini" src="" class="avatar">
                    <div>
                        <p style="font-size: 11px; color: #aaa; margin:0; text-transform: uppercase;">Premium</p>
                        <h2 id="name-mini" style="font-size: 15px; font-weight: 700; margin:0; color: var(--dark);"></h2>
                    </div>
                </div>
                <div class="logo-txt">Live<span>Mad</span></div>
            </header>

            <div class="form-content">
                <div class="input-group">
                    <input type="text" id="origin" placeholder="Punto de encuentro">
                    <i class="fa-solid fa-location-crosshairs" onclick="geolocalizar()"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="destination" placeholder="¿A dónde vamos?">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div id="map"></div>
            
            <button id="btnAction" class="btn-main" onclick="procesarViaje()">
                CALCULAR PRECIO
            </button>
        </div>

        <div id="view-profile">
            <img id="img-large" src="" class="avatar" style="width:110px; height:110px; margin: 0 auto 20px; border: 4px solid var(--blue);">
            <h2 id="name-large" class="text-2xl font-bold"></h2>
            <p class="text-blue-500 font-semibold mb-8">Cliente VIP</p>
            
            <div class="bg-gray-100 p-5 rounded-2xl text-left space-y-3">
                <p><strong>Usuario ID:</strong> <span id="info-user"></span></p>
                <p><strong>Email:</strong> vip@livemad.com</p>
                <p><strong>SaaS Tier:</strong> Enterprise</p>
            </div>

            <button onclick="logout()" class="mt-12 text-red-500 font-bold flex items-center justify-center w-full gap-2">
                <i class="fa-solid fa-right-from-bracket"></i> CERRAR SESIÓN
            </button>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" id="btn-home" onclick="nav('home')">
                <i class="fa-solid fa-house"></i>Home
            </div>
            <div class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i>Viajes</div>
            <div class="nav-item" id="btn-profile" onclick="nav('profile')">
                <i class="fa-solid fa-circle-user"></i>Perfil
            </div>
        </nav>

    </div>
</div>

<script>
    // --- CONFIGURACIÓN SUPABASE ---
    const SUPABASE_URL = 'https://TU_PROYECTO_URL.supabase.co';
    const SUPABASE_KEY = 'TU_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map, directionsService, directionsRenderer, geocoder;
    let ultimoCalculo = null;
    let estadoApp = "CALCULAR"; // "CALCULAR" o "RESERVAR"

    const USER_DATA = {
        user: "admin",
        nombre: "Dani Martínez",
        foto: "https://i.pravatar.cc/150?u=admin"
    };

    function intentarAcceso() {
        const u = document.getElementById('user-login').value;
        const p = document.getElementById('pass-login').value;

        if (u === 'admin' && p === '1234') {
            document.getElementById('name-mini').innerText = USER_DATA.nombre;
            document.getElementById('name-large').innerText = USER_DATA.nombre;
            document.getElementById('info-user').innerText = USER_DATA.user;
            document.getElementById('img-mini').src = USER_DATA.foto;
            document.getElementById('img-large').src = USER_DATA.foto;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            
            initMap();
        } else {
            alert("Credenciales incorrectas");
        }
    }

    function initMap() {
        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer({
            polylineOptions: { strokeColor: '#4f46e5', strokeWeight: 5 }
        });
        geocoder = new google.maps.Geocoder();
        
        map = new google.maps.Map(document.getElementById('map'), {
            center: {lat: 40.4168, lng: -3.7038}, 
            zoom: 14, 
            disableDefaultUI: true,
            styles: [{"featureType": "poi", "stylers": [{"visibility": "off"}]}]
        });
        directionsRenderer.setMap(map);

        const opts = { componentRestrictions: { country: "es" } };
        new google.maps.places.Autocomplete(document.getElementById('origin'), opts);
        new google.maps.places.Autocomplete(document.getElementById('destination'), opts);
    }

    function geolocalizar() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                geocoder.geocode({ location: coords }, (res, status) => {
                    if (status === "OK") document.getElementById('origin').value = res[0].formatted_address;
                });
                map.setCenter(coords);
            });
        }
    }

    async function procesarViaje() {
        const btn = document.getElementById('btnAction');

        if (estadoApp === "CALCULAR") {
            const o = document.getElementById('origin').value;
            const d = document.getElementById('destination').value;
            if(!o || !d) return alert("Por favor, introduce origen y destino.");

            directionsService.route({ origin: o, destination: d, travelMode: 'DRIVING' }, (res, status) => {
                if(status === 'OK') {
                    directionsRenderer.setDirections(res);
                    const leg = res.routes[0].legs[0];
                    const km = leg.distance.value / 1000;
                    const precioFinal = (6 + km * 1.60).toFixed(2);
                    
                    ultimoCalculo = {
                        origen: o,
                        destino: d,
                        distancia: km.toFixed(2) + " km",
                        precio: precioFinal
                    };

                    btn.innerText = `PEDIR AHORA (${precioFinal}€)`;
                    estadoApp = "RESERVAR";
                } else {
                    alert("No se pudo encontrar una ruta válida.");
                }
            });
        } 
        else if (estadoApp === "RESERVAR") {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> BUSCANDO CONDUCTOR...';

            // --- ENVÍO REAL A SUPABASE ---
            const { error } = await supabaseClient
                .from('viajes')
                .insert([{ 
                    cliente_nombre: USER_DATA.nombre,
                    origen: ultimoCalculo.origen,
                    destino: ultimoCalculo.destino,
                    precio: parseFloat(ultimoCalculo.precio),
                    distancia: ultimoCalculo.distancia,
                    estado: 'pendiente'
                }]);

            if (error) {
                console.error(error);
                alert("Error de conexión con Supabase.");
                btn.disabled = false;
                btn.innerText = `REINTENTAR (${ultimoCalculo.precio}€)`;
            } else {
                alert("¡Viaje solicitado con éxito! Un conductor Premium aceptará tu solicitud pronto.");
                location.reload(); // Reiniciar para nueva solicitud
            }
        }
    }

    function nav(dest) {
        document.getElementById('view-home').style.display = dest === 'home' ? 'flex' : 'none';
        document.getElementById('view-profile').style.display = dest === 'profile' ? 'block' : 'none';
        document.getElementById('btn-home').classList.toggle('active', dest === 'home');
        document.getElementById('btn-profile').classList.toggle('active', dest === 'profile');
    }

    function logout() { location.reload(); }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxdjJ1HyJoVgeP6NFoS2i4va-tdRjrJIA&libraries=places" async defer></script>

</body>
</html>
