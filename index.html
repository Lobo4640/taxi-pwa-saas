<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TaxMad – Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
<body class="bg-black text-white">

    <div id="map" style="width: 100%; height: 45vh; background: #111;"></div>

    <div class="p-6">
        <h1 class="text-cyan-400 text-center font-bold tracking-widest mb-4">MADRID CHAUFFEUR</h1>
        <input type="text" id="destino" placeholder="¿A dónde vas?" class="w-full p-4 bg-zinc-900 rounded-xl mb-3 border border-zinc-800">
        <input type="text" id="origen" placeholder="Punto de recogida" class="w-full p-4 bg-zinc-900 rounded-xl mb-4 border border-zinc-800">
        <button class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 p-4 rounded-xl font-bold uppercase" onclick="alert('Enviando...')">Book Now</button>
    </div>

    <script>
        // Declaración global de la función
        window.initMap = function() {
            console.log("Mapa cargado con éxito");
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 40.4168, lng: -3.7038 },
                zoom: 14,
                disableDefaultUI: true,
                styles: [{ "elementType": "geometry", "stylers": [{ "color": "#212121" }] }]
            });
            new google.maps.places.Autocomplete(document.getElementById('origen'), { componentRestrictions: { country: "es" } });
            new google.maps.places.Autocomplete(document.getElementById('destino'), { componentRestrictions: { country: "es" } });
        };
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxdjJ1HyJoVgeP6NFoS2i4va-tdRjrJIA&libraries=places&callback=initMap" async defer></script>
</body>
</html>
