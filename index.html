<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxMad – Premium Chauffeur</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }

        /* Mapa con altura controlada para que no tape el resto */
        #map {
            width: 100%;
            height: 42vh; 
            background-color: #121212;
            z-index: 1;
        }

        .booking-container {
            padding: 25px 20px;
            background: linear-gradient(180deg, #0d0d0d 0%, #000000 100%);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            margin-top: -30px; /* Efecto de superposición sobre el mapa */
            position: relative;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .input-group {
            background: #161616;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            border: 1px solid #222;
        }

        .input-group i { color: #00f2fe; margin-right: 12px; font-size: 18px; }

        input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
        }

        .vehicle-selection {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
            gap: 10px;
        }

        .vehicle-card {
            flex: 1;
            text-align: center;
            padding: 12px 5px;
            border-radius: 15px;
            background: #111;
            border: 1px solid #222;
            transition: 0.3s;
            cursor: pointer;
        }

        .vehicle-card.active {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.1);
        }

        .vehicle-card i { font-size: 20px; margin-bottom: 5px; display: block; color: #888; }
        .vehicle-card.active i { color: #00f2fe; }
        .vehicle-card span { font-size: 10px; font-weight: bold; color: #666; text-transform: uppercase; }
        .vehicle-card.active span { color: #fff; }

        .btn-reserve {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="booking-container">
        <div class="text-center mb-6">
            <h2 style="color: #00f2fe; font-weight: bold; letter-spacing: 3px; font-size: 14px;">MADRID CHAUFFEUR</h2>
        </div>

        <div class="input-group">
            <i class="fas fa-search"></i>
            <input type="text" id="destino" placeholder="¿A dónde vas?">
        </div>

        <div class="input-group">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" id="origen" placeholder="Punto de recogida">
        </div>

        <div class="flex gap-2 mb-2">
            <div class="input-group w-1/2">
                <i class="fas fa-user"></i>
                <input type="text" id="nombre" placeholder="Nombre">
            </div>
            <div class="input-group w-1/2">
                <i class="fas fa-phone"></i>
                <input type="text" id="telefono" placeholder="Móvil">
            </div>
        </div>

        <div class="vehicle-selection">
            <div class="vehicle-card active" onclick="selectVehicle(this, 'Standard')">
                <i class="fas fa-car"></i>
                <span>Standard</span>
            </div>
            <div class="vehicle-card" onclick="selectVehicle(this, 'Executive')">
                <i class="fas fa-car-side"></i>
                <span>Executive</span>
            </div>
            <div class="vehicle-card" onclick="selectVehicle(this, 'Van')">
                <i class="fas fa-bus"></i>
                <span>Van</span>
            </div>
        </div>

        <button class="btn-reserve" id="btn-reservar" onclick="reservarAhora()">Book Now</button>
    </div>

    <script>
        // 1. CONFIGURACIÓN SUPABASE (Nombre único para evitar redeclaración)
        const SP_URL = 'https://asqglwuasvpwstyzvujy.supabase.co';
        const SP_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzcWdsd2xnZ3F4YW55cWtzdXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDc1NjUsImV4cCI6MjA4NjcyMzU2NX0.nFCvgWihLakBxfXX32NuXjHdJXCH5IYVfddoyehbkHg';
        const _supabase = window.supabase.createClient(SP_URL, SP_KEY);

        let selectedVehicle = "Standard";

        function selectVehicle(el, type) {
            document.querySelectorAll('.vehicle-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedVehicle = type;
        }

        // 2. FUNCIÓN DEL MAPA (Global para Google)
        window.initMap = function() {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 40.4168, lng: -3.7038 }, 
                zoom: 14,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#212121" }] },
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                    { "featureType": "road", "elementType": "geometry", "stylers": [{ "color": "#2c2c2c" }] },
                    { "featureType": "water", "elementType": "geometry", "stylers": [{ "color": "#000000" }] }
                ],
                disableDefaultUI: true
            });

            const options = { componentRestrictions: { country: "es" } };
            new google.maps.places.Autocomplete(document.getElementById('origen'), options);
            new google.maps.places.Autocomplete(document.getElementById('destino'), options);
        };

        // 3. ENVIAR RESERVA
        async function reservarAhora() {
            const btn = document.getElementById('btn-reservar');
            const data = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                origen: document.getElementById('origen').value,
                destino: document.getElementById('destino').value,
                vehiculo: selectedVehicle
            };

            if (!data.origen || !data.destino || !data.nombre) {
                return alert("Por favor, completa los campos principales");
            }

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            try {
                const { error } = await _supabase.from('reservas').insert([data]);
                if (error) throw error;
                alert("¡Reserva confirmada! Nos pondremos en contacto.");
                location.reload();
            } catch (err) {
                alert("Error: " + err.message);
                btn.innerText = "BOOK NOW";
                btn.disabled = false;
            }
        }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDxdjJ1HyJoVgeP6NFoS2i4va-tdRjrJIA&libraries=places&callback=initMap" async defer></script>
</body>
</html>
